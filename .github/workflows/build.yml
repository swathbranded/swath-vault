name: Build and publish the Vault

on:
  push:
    branches: [main]
  schedule:
    # Every day at 09:15 UTC (4:15 AM Central), after PCNA regenerates its feeds.
    - cron: "15 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python build.py --refresh
        env:
             PCNA_PS_ID: ${{ secrets.PCNA_PS_ID }}
             PCNA_PS_PASSWORD: ${{ secrets.PCNA_PS_PASSWORD }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
